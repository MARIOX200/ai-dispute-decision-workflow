[project]
name = "ai-dispute-decision-workflow"
version = "0.1.0"
description = "Production-oriented AI workflow portfolio: retrieval, HITL, fallbacks, evaluation and auditability"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "scikit-learn>=1.4,<2",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
